# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric properties, checked against https://fabricmc.net/develop
#
# Target: Minecraft 26.2 ("Chaos Cubed")
# When 26.3 ("Wilderness Bound") support is wanted, only this block changes:
#   minecraft_version=26.3
#   fabric_api_version=0.165.0+26.3
# The loader (0.20.1), Loom (1.19-SNAPSHOT) and Java (25) are identical for
# 26.2 and 26.3, and Minecraft is unobfuscated in both, so no mappings entry
# is needed. See README.md, section "Updating to 26.3".
minecraft_version=26.2
loader_version=0.20.1
loom_version=1.19-SNAPSHOT
fabric_api_version=0.161.0+26.2
java_version=25

# Mod properties
mod_version=1.7.0
maven_group=dev.cinecam
archives_base_name=cinecam
